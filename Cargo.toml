[package]
name = "hog"
version = "0.1.0"
edition = "2024"
description = "Find what's hogging your disk"
license = "MIT"
repository = "https://github.com/evanofslack/hog"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
humansize = "2.1.3"
jwalk = "0.9.0"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
